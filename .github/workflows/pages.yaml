name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'docs/content/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch probe data from latest-results
        run: |
          git fetch origin latest-results || true
          mkdir -p docs/static/probe
          git show origin/latest-results:probe/data.js > docs/static/probe/data.js 2>/dev/null || true

      - name: Build site
        working-directory: web
        run: |
          npm ci
          node build.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
